name: Monthly Library Sync & Rebuild

on:
  schedule:
    # Runs on the 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild Worker Bundle & Run Tests
        run: |
          npm test
          node src/build-worker.js

      - name: Check for updates and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain worker-addon.js)" ]; then
            git add worker-addon.js
            git commit -m "chore(sync): automated monthly worker bundle update [skip ci]"
            git push
          else
            echo "No library changes detected."
          fi
